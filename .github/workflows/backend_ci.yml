name: Backend CI & Safety Contract Verification

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'lambda/**'
      - 'standalone_agent/**'
      - 'tests/**'
      - 'schemas/**'
      - 'requirements-dev.txt'
      - 'pytest.ini'
      - '.github/workflows/backend_ci.yml'
  pull_request:
    branches:
      - main
      - master
    paths:
      - 'lambda/**'
      - 'standalone_agent/**'
      - 'tests/**'
      - 'schemas/**'
      - 'requirements-dev.txt'
      - 'pytest.ini'
      - '.github/workflows/backend_ci.yml'
  workflow_dispatch:

jobs:
  test:
    name: Pytest Suite & Anti-Hallucination Contracts (517 Tests)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Execute Full Test Suite
        env:
          PYTHONPATH: .
        run: |
          python -m pytest -v --durations=10
